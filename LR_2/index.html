<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Лабораторная №2</title>
        <link rel="icon" type="image/png" href="cat.png">
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <div id="screen-table">
            <h2>Список студентов</h2>
            
            <!-- Секция фильтрации -->
            <div class="filter-section">
                <h3>Фильтрация студентов</h3>
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filter-group">Группа:</label>
                        <input type="text" id="filter-group" placeholder="M3301">
                    </div>
                    
                    <div class="filter-group">
                        <label for="filter-dormitory">Общежитие:</label>
                        <input type="number" id="filter-dormitory" placeholder="8" min="1">
                    </div>

                    <div class="filter-group">
                        <label for="filter-room">Комната:</label>
                        <input type="number" id="filter-room" placeholder="123" min="1">
                    </div>
                    
                    <div class="filter-group">
                        <label for="filter-foreigner">Иностранный:</label>
                        <select id="filter-foreigner">
                            <option value="">Все</option>
                            <option value="true">Да</option>
                            <option value="false">Нет</option>
                        </select>
                    </div>
                </div>
                
                <div class="filter-actions">
                    <button id="btn-apply-filter">Применить фильтр</button>
                    <button id="btn-clear-filter">Сбросить</button>
                </div>
            </div>

            <button id="btn-add">Добавить студента</button>

            <div class="table-wrapper">
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Группа</th>
                            <th>ИСУ ID</th>
                            <th>Общежитие</th>
                            <th>Комната</th>
                            <th>Срок заселения</th>
                            <th>Иностранный</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body">
                        <tr><td colspan="8" style="text-align: center;">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="screen-form">
            <h2>Форма добавления/редактирования</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="fio">ФИО студента:</label>
                    <input type="text" id="fio" name="fio" required placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-group">
                    <label for="group">Группа:</label>
                    <input type="text" id="group" name="group" required placeholder="M3301">
                </div>

                <div class="form-group">
                    <label for="isu">ИСУ ID:</label>
                    <input type="text" id="isu" name="isu" required placeholder="676767" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="dorm">Номер общежития:</label>
                    <input type="text" id="dorm" name="dorm" placeholder="5" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="room">Номер комнаты:</label>
                    <input type="text" id="room" name="room" placeholder="52" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="date">Срок заселения:</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="foreigner" name="foreigner">
                    <label for="foreigner">Иностранный студент</label>
                </div>

                <div class="form-group">
                    <label for="notes">Заметки:</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Любая дополнительная информация" maxlength="200"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save">Сохранить</button>
                    <button type="button" id="btn-cancel-form">Отмена</button>
                </div>
            </form>
        </div>

        <div id="screen-dossier">
            <h2>Досье студента</h2>
            <div class="dossier-card">
                <div id="dossier-content"></div>
                <button id="btn-close-dossier">Назад к списку</button>
            </div>
        </div>

        <!-- Подключаем новые скрипты -->
        <script src="api.js"></script>
        <script src="main.js"></script>
    </body>
</html>
